<div class="mx-auto my-5 max-w-screen-xl">
    <div>
        <div class="text-4xl text-center py-7">My Modules</div>
    </div>

    <div *ngIf="userAuth.isLoggedIn === true; else notloggedin">
        <div *ngIf="user">
            <div class="p-5 border-2 rounded-lg my-4 hover:bg-gray-300 hover:border-gray-300">
                <h2 class="text-4xl">Student: {{user.firstName}} {{user.lastName}}</h2>
                <h2 class="text-2xl">Email: {{user.email}}</h2>
                <h2 class="text-2xl">Enrollment Status: Coming Soon...</h2>
                <h2 class="text-2xl">Course: Coming Soon...</h2>
            </div>
            <hr class="border-t-2 border-gray-500 my-5">
            <p class="my-4">Modules you are enrolled in...</p>
            <div *ngIf="user.userModules!.length > 0; else nocontent">
                <ul class="grid grid-cols-1 gap-6 md:grid-cols-2">
                    <li *ngFor="let user of user.userModules" >
                        <label class="inline-flex items-center justify-between p-5 bg-white hover:shadow-lg border-2 border-white w-full cursor-pointer rounded-lg">
                            <div class="block">
                                <div class="text-xl font-medium mb-2">{{user.title}}</div>
                                <div>{{user.description}}</div>
                            </div>
                        </label>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>

<ng-template #nocontent>
    <div class="p-10 border border-gray-700 bg-gray-300 rounded-md">
        <p class="text-center">Subject list is empty...</p>
    </div>
</ng-template>

<ng-template #notloggedin>
    <div class="p-10 border border-gray-700 bg-gray-300 rounded-md">
        <p class="text-center">No Data.</p>
        <p class="text-center">Please signup or login.</p>
    </div>
</ng-template>
